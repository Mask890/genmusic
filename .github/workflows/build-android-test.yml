name: Build Android test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-test:
    runs-on: ubuntu-latest
    env:
      PEBBLE_ANDROID_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android 36 tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx vite build --config native/vite.config.ts
      - name: Verify offline player output
        run: test -f dist-native/index.html
      - run: bunx cap add android && bunx cap sync android
      - name: Build installable test APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Name test download
        run: |
          mkdir -p native-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "native-artifacts/Pebble-Test-${GITHUB_RUN_NUMBER}-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Pebble-Android-Test-${{ github.run_number }}
          path: native-artifacts/Pebble-Test-*-Android.apk
          if-no-files-found: error
          retention-days: 14
      - name: Test build notice
        run: |
          printf '%s\n' '## Pebble Android test' 'Download the ZIP under Artifacts on this run, then extract the APK.' 'This is a debug-signed test, not a production release. No release-signing secrets are required.' 'It installs as Pebble Test, separately from Pebble. Test playback, imports, saved music, and all seven visualizers on a real Android device.' 'Debug keys can change between runs; reinstalling may require uninstalling Pebble Test and will remove its saved library. Keep the original music files.' 'This workflow does not publish a GitHub Release or activate website download buttons.' >> "$GITHUB_STEP_SUMMARY"