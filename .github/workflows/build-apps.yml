name: Build Pebble apps
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**', 'roadmap.md', '.lovable/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pebble-app-release
  cancel-in-progress: false
env:
  APP_VERSION: 0.1.${{ github.run_number }}
  BUILD_NUMBER: ${{ github.run_number }}
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx vite build --config native/vite.config.ts
      - run: node scripts/package-desktop.mjs
      - name: Create Mac disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p native-artifacts/dmg
          cp -R native-artifacts/Pebble-darwin-universal/Pebble.app native-artifacts/dmg/
          ln -s /Applications native-artifacts/dmg/Applications
          hdiutil create -volname Pebble -srcfolder native-artifacts/dmg -ov -format UDZO "native-artifacts/Pebble-${APP_VERSION}-Mac.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            native-artifacts/installer/Pebble-*-Windows.exe
            native-artifacts/Pebble-*-Mac.dmg
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/pebble-release.keystore
    steps:
      - uses: actions/checkout@v4
      - name: Check release signing credentials
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing Android signing secret: $name"; exit 1; fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx vite build --config native/vite.config.ts
      - run: bunx cap add android && bunx cap sync android
      - run: node scripts/prepare-android.mjs
      - name: Build signed APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - run: mkdir -p native-artifacts && cp android/app/build/outputs/apk/release/app-release.apk "native-artifacts/Pebble-${APP_VERSION}-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: native-artifacts/*.apk
          if-no-files-found: error
  release:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${APP_VERSION}" release-files/*.exe release-files/*.dmg release-files/*.apk --target "${GITHUB_SHA}" --title "Pebble ${APP_VERSION}" --notes "Pebble ${APP_VERSION}: local playback and seven audio-reactive visualizers. Desktop installers are unsigned and may trigger security warnings. Download and install to update; keep your Android signing key unchanged."
